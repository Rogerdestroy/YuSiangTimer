<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<title>計時器工具箱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%231f7a5c'/%3E%3Crect x='26' y='4' width='12' height='8' rx='2' fill='%231f7a5c'/%3E%3Cpath d='M32 36V20' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f2;--surface:#ffffff;--surface2:#eef0ec;--text:#1c2320;--muted:#65706a;--line:#dce0da;
  --accent:#1f7a5c;--accent-ink:#ffffff;--work:#d4531c;--rest:#2b8a52;--warn:#c98a00;--danger:#c62f38;
  --info:#2f6fb5;--cool:#7a55b8;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
  --light-green:#2b8a52;--light-yellow:#e2a600;--light-red:#c62f38;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513;--surface:#1a1f1c;--surface2:#232a26;--text:#e7ebe8;--muted:#9aa49e;--line:#2d3531;
    --accent:#3db387;--accent-ink:#06140e;--work:#ff7b45;--rest:#4cc47c;--warn:#f0b72f;--danger:#ff5f68;
    --info:#62a1e6;--cool:#a98be0;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#1a1f1c;--surface2:#232a26;--text:#e7ebe8;--muted:#9aa49e;--line:#2d3531;
  --accent:#3db387;--accent-ink:#06140e;--work:#ff7b45;--rest:#4cc47c;--warn:#f0b72f;--danger:#ff5f68;
  --info:#62a1e6;--cool:#a98be0;--shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);min-height:100vh;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit}
a{color:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 16px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0 6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;padding:8px 10px;border-radius:10px;color:var(--accent);white-space:nowrap}
.back:hover{background:var(--surface2)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-decoration:none;font-size:18px;flex:none}
.iconbtn:hover{background:var(--surface2)}
main{max-width:980px;margin:0 auto;padding:16px 16px 56px}

/* home */
.intro{margin:6px 2px 18px}
.intro h2{font-size:26px;margin:0 0 4px}
.intro p{margin:0;color:var(--muted)}
.cat{margin:22px 2px 10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;transition:transform .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .ic{font-size:30px;line-height:1;flex:none;width:48px;height:48px;display:grid;place-items:center;background:var(--surface2);border-radius:12px}
.tcard h3{margin:0 0 2px;font-size:17px}
.tcard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.live{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.live:empty{display:none}
.foot{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.7}
.foot code{background:var(--surface2);padding:1px 6px;border-radius:6px}

/* shared components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hero{--c:var(--accent);text-align:center;padding:22px 14px 20px;position:relative;overflow:hidden}
.hero .phase{font-weight:700;color:var(--c);letter-spacing:.03em;font-size:17px;min-height:1.5em}
.hero .stepname{font-size:clamp(26px,6vw,46px);font-weight:800;line-height:1.2;margin:4px 0 2px;color:var(--c);word-break:break-word}
.big{font-size:clamp(64px,17vw,156px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:4px 0}
.hero .sub{color:var(--muted);font-size:15px;min-height:1.5em}
.hero.over .big{color:var(--danger)}
.hero[data-phase="work"]{--c:var(--work)}
.hero[data-phase="rest"]{--c:var(--rest)}
.hero[data-phase="prep"]{--c:var(--info)}
.hero[data-phase="cool"]{--c:var(--cool)}
.hero[data-phase="short"]{--c:var(--rest)}
.hero[data-phase="long"]{--c:var(--info)}
.hero[data-phase="focus"]{--c:var(--work)}
.hero[data-phase="done"]{--c:var(--accent)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:14px auto 4px;max-width:560px}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--accent));border-radius:inherit;transition:width .3s linear}
.hero.over .bar i{background:var(--danger)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;padding:10px 16px;
  border-radius:12px;cursor:pointer;min-height:44px;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.xl{font-size:20px;padding:14px 28px;min-width:min(100%,300px)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14.5px;font-weight:600;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:600;min-width:0}
.field.grow{flex:1 1 200px}
.field-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:12px}
.lbl-line{font-size:14px;color:var(--muted);font-weight:600;margin:4px 0 6px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=number]{width:90px}
input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--accent);flex:none}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer;margin-top:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);height:40px}
.stepper button{border:0;background:transparent;width:38px;height:100%;cursor:pointer;font-size:18px;font-weight:700}
.stepper button:hover{background:var(--line)}
.stepper span{min-width:40px;text-align:center;font-weight:700;color:var(--text);font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat .l{display:block;font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:700}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--danger)} .stat.good .v{color:var(--rest)}
table.log{width:100%;border-collapse:collapse;font-size:15px}
table.log th,table.log td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.log th{font-size:13px;color:var(--muted);font-weight:600}
table.log td.num,table.log th.num{text-align:right;font-variant-numeric:tabular-nums}
table.log tr.best td{color:var(--rest);font-weight:700}
table.log tr.worst td{color:var(--danger)}
table.log tr.cur td{color:var(--muted);font-style:italic}
.empty{color:var(--muted);text-align:center;margin:12px 0 4px;font-size:14px}
details.cfg>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.cfg>summary::-webkit-details-marker{display:none}
details.cfg>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.cfg[open]>summary::after{transform:rotate(180deg)}
details.cfg[open]>summary{margin-bottom:12px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.55}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

/* ring */
.ringwrap{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:6px auto 4px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface2)}
.ring .fg{stroke:var(--c,var(--accent));stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset .3s linear}
.hero.over .ring .fg{stroke:var(--danger)}
.ringwrap .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .big{font-size:clamp(52px,15vw,88px)}
.tabs{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--c);box-shadow:var(--shadow)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.dots i.on{background:var(--work);border-color:var(--work)}

/* teach */
.steps{display:flex;flex-direction:column;gap:8px}
.step-row{display:grid;grid-template-columns:auto 12px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.step-row.off{opacity:.5}
.step-row .sw{width:12px;height:28px;border-radius:4px}
.step-row .nm{background:var(--surface)}
.step-row .mn{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);white-space:nowrap}
.step-row .mn input{width:72px;background:var(--surface);text-align:right}
.ops{display:flex;gap:2px}
.ib{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:15px}
.ib:hover:not(:disabled){background:var(--line);color:var(--text)}
.ib:disabled{opacity:.25;cursor:default}
@media (max-width:560px){
  .step-row{grid-template-columns:auto 10px minmax(0,1fr) auto;grid-template-areas:"c s n n" "c s m o"}
  .step-row>input[type=checkbox]{grid-area:c}.step-row .sw{grid-area:s;height:100%}
  .step-row .nm{grid-area:n}.step-row .mn{grid-area:m}.step-row .ops{grid-area:o;justify-self:end}
}
.alloc{margin:14px 0 6px}
.alloc-bar,.timeline{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--surface2);position:relative}
.alloc-bar>div,.timeline>div{min-width:2px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:2px solid var(--surface);padding:0 4px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.alloc-bar>.gap{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,var(--line) 6px,var(--line) 12px);color:var(--muted);text-shadow:none}
.alloc-text{font-size:14px;margin-top:6px;font-weight:600}
.alloc-text.ok{color:var(--rest)} .alloc-text.under{color:var(--warn)} .alloc-text.over{color:var(--danger)}
.timeline{height:38px;margin-bottom:12px}
.timeline>div{opacity:.4}
.timeline>div.done{opacity:.7}
.timeline>div.cur{opacity:1}
.timeline .now{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--text);border-radius:2px;transform:translateX(-50%);transition:left .3s linear;border:0;padding:0;min-width:0}
.teach-run .hero{border-top:6px solid var(--c)}
.d-over{color:var(--danger);font-weight:700}.d-under{color:var(--info);font-weight:700}
.sdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* exam */
.exam-hero{text-align:center;padding:26px 14px}
.exam-date{color:var(--muted);font-weight:600;font-size:clamp(16px,2.5vw,22px)}
.exam-clock{font-size:clamp(72px,19vw,210px);font-weight:700;line-height:1;letter-spacing:-.02em;margin:6px 0 10px}
.exam-subject{font-size:clamp(26px,5vw,48px);font-weight:800;margin:0}
.exam-range{color:var(--muted);font-size:clamp(17px,2.6vw,24px);font-weight:600}
.exam-status{display:inline-flex;flex-direction:column;align-items:center;margin-top:16px;padding:10px 26px;border-radius:16px;background:var(--surface2);min-width:min(100%,320px)}
.exam-status .l{font-weight:700;color:var(--muted)}
.exam-status .v{font-size:clamp(40px,9vw,84px);font-weight:700;line-height:1.1}
.exam-status.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}.exam-status.warn .v{color:var(--warn)}
.exam-status.bad{background:color-mix(in srgb,var(--danger) 16%,var(--surface))}.exam-status.bad .v{color:var(--danger)}
.exam-notes{white-space:pre-line;font-size:clamp(17px,2.6vw,26px);margin-top:16px;font-weight:600}
.exam-notes:empty{display:none}

/* speech */
.speech-hero{transition:background .4s,color .4s}
.speech-hero[data-light="green"]{background:var(--light-green);color:#fff;border-color:transparent}
.speech-hero[data-light="yellow"]{background:var(--light-yellow);color:#1a1400;border-color:transparent}
.speech-hero[data-light="red"]{background:var(--light-red);color:#fff;border-color:transparent}
.speech-hero[data-light] .phase,.speech-hero[data-light] .sub{color:inherit;opacity:.9}
.speech-hero[data-light="idle"]{background:var(--surface)}
.speech-hero[data-light="idle"] .phase{color:var(--muted)}
.lights{display:flex;gap:12px;justify-content:center;margin-top:12px}
.lights i{width:22px;height:22px;border-radius:50%;background:rgba(127,127,127,.25);border:2px solid rgba(255,255,255,.35)}
.lights i.g.on{background:#3bd16f}.lights i.y.on{background:#ffd23f}.lights i.r.on{background:#ff4b55}

/* overlay bits */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;
  font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.flash::after{content:"";position:fixed;inset:0;background:var(--accent);pointer-events:none;z-index:55;animation:fl 1.2s ease-out}
@keyframes fl{0%{opacity:.45}25%{opacity:0}45%{opacity:.35}100%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;padding:20px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal p{margin:0 0 14px;white-space:pre-line}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* fullscreen / presentation */
:root.fs .cfg,:root.fs .nofs{display:none!important}
:root.fs main{max-width:none;padding-top:12px}
:root.fs .big{font-size:clamp(90px,22vw,340px)}
:root.fs .ringwrap{width:min(70vh,80vw)}
:root.fs .ringwrap .big{font-size:clamp(70px,13vh,160px)}
:root.fs .exam-clock{font-size:clamp(100px,24vw,360px)}
:root.fs .hero .stepname{font-size:clamp(34px,7vw,90px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" id="backBtn" href="#" hidden>‹ 全部計時器</a>
  <h1 id="pageTitle">計時器工具箱</h1>
  <button class="iconbtn" id="soundBtn" title="音效開關" aria-label="音效開關">🔔</button>
  <button class="iconbtn" id="themeBtn" title="切換深淺色" aria-label="切換深淺色">🌓</button>
  <button class="iconbtn" id="fsBtn" title="全螢幕（F）" aria-label="全螢幕">⛶</button>
  <a class="iconbtn" id="newTabBtn" target="_blank" rel="noopener" title="在新分頁開啟" aria-label="在新分頁開啟" hidden>↗</a>
</header>
<main id="app">
  <section id="v-home" class="view"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= 共用工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('ystimer:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ystimer:' + k, JSON.stringify(v)); } catch (e) {} }
};
const pad = (n, l = 2) => String(n).padStart(l, '0');
function fmtS(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }
const up = ms => fmtS(Math.floor(Math.max(0, ms) / 1000));                          // 正向計時
const down = ms => ms > 0 ? fmtS(Math.ceil(ms / 1000)) : (ms > -1000 ? '00:00' : '+' + fmtS(Math.floor(-ms / 1000))); // 倒數，超時顯示 +
const cs = ms => `${fmtS(Math.floor(ms / 1000))}.${pad(Math.floor(ms % 1000 / 10))}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const num = (v, d = 0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };

/* 以真實時間為準的計時器，背景分頁也不會跑慢 */
class Clock {
  constructor(o) { this.acc = (o && o.acc) || 0; this.t0 = (o && o.t0) || null; }
  get on() { return this.t0 !== null; }
  get ms() { return this.acc + (this.t0 !== null ? Date.now() - this.t0 : 0); }
  play() { if (this.t0 === null) this.t0 = Date.now(); }
  pause() { if (this.t0 !== null) { this.acc += Date.now() - this.t0; this.t0 = null; } }
  toggle() { this.on ? this.pause() : this.play(); }
  reset() { this.acc = 0; this.t0 = null; }
  set(ms) { this.acc = ms; if (this.t0 !== null) this.t0 = Date.now(); }
  toJSON() { return { acc: this.acc, t0: this.t0 }; }
}

/* 音效 */
const Sound = {
  ctx: null, on: store.get('sound', true),
  unlock() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, at, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

/* 自製確認／輸入框（嵌入協作平台時瀏覽器內建的 confirm 可能被封鎖） */
function ask(msg, { ok = '確定', cancel = '取消', input = null, danger = false } = {}) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p>${input !== null ? `<input id="askIn" value="${esc(input)}">` : ''}

    document.body.appendChild(m);
    const inp = $('#askIn', m); (inp || $('[data-r="1"]', m)).focus(); if (inp) inp.select();
    const done = r => { m.remove(); res(input !== null ? (r ? inp.value.trim() : null) : r); };
    m.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === m) done(false); });

const hiit = {
  id: 'interval', name: '間歇訓練 HIIT', icon: '🔥', cat: '運動健身', desc: 'Tabata 等「運動／休息」交替循環，切換前 3 秒嗶聲倒數',
  html: `
  <div class="card hero" data-k="hero" data-phase="prep">
    <div class="phase" data-k="phase">準備</div>
    <div class="big mono" data-k="big">00:10</div>
    <div class="sub" data-k="sub"></div>
    <div class="bar"><i data-k="bar"></i></div>
    <div class="sub" data-k="next"></div>
  </div>
  <div class="row"><button class="btn" data-act="reset">重設</button><button class="btn primary xl" data-act="toggle" data-k="toggle">開始</button><button class="btn" data-act="skip">跳過 ⏭</button></div>
  <div class="card cfg">
    <div class="lbl-line">快速套用</div>
    <div class="chips" style="margin-bottom:12px">
      <button class="chip" data-act="pre" data-v="10,20,10,8,0">Tabata 20/10 ×8</button>
      <button class="chip" data-act="pre" data-v="10,30,30,10,0">30/30 ×10</button>
      <button class="chip" data-act="pre" data-v="10,40,20,8,0">40/20 ×8</button>
      <button class="chip" data-act="pre" data-v="10,45,15,6,60">45/15 ×6＋緩和</button>
      <button class="chip" data-act="pre" data-v="5,60,0,10,0">EMOM 1 分 ×10</button>
    </div>
    <fieldset data-k="fs"><div class="field-row" style="margin-bottom:0">
      <label class="field">準備（秒）<input type="number" min="0" data-c="prep"></label>
      <label class="field">運動（秒）<input type="number" min="1" data-c="work"></label>
      <label class="field">休息（秒）<input type="number" min="0" data-c="rest"></label>
      <label class="field">回合數<input type="number" min="1" data-c="rounds"></label>
      <label class="field">緩和（秒）<input type="number" min="0" data-c="cool"></label>
    </div></fieldset>
    <p class="hint" data-k="info"></p>
  </div>`,
  init(el) {
    this.el = el; this.k = {}; $$('[data-k]', el).forEach(n => this.k[n.dataset.k] = n);
    this.cfg = Object.assign({ prep: 10, work: 20, rest: 10, rounds: 8, cool: 0 }, store.get('hiitCfg', {}));
    this.clock = new Clock(); this.done = false;
    $$('[data-c]', el).forEach(inp => inp.addEventListener('change', () => { const c = inp.dataset.c; this.cfg[c] = Math.max(+inp.min, Math.round(num(inp.value, this.cfg[c]))); this.apply(); }));
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) this.act(b.dataset.act, b); });
    this.apply();
  },
  apply() {
    store.set('hiitCfg', this.cfg); $$('[data-c]', this.el).forEach(inp => inp.value = this.cfg[inp.dataset.c]);
    const c = this.cfg, seq = [];
    if (c.prep > 0) seq.push({ t: 'prep', d: c.prep });
    for (let i = 1; i <= c.rounds; i++) { seq.push({ t: 'work', d: c.work, r: i }); if (i < c.rounds && c.rest > 0) seq.push({ t: 'rest', d: c.rest, r: i }); }
    if (c.cool > 0) seq.push({ t: 'cool', d: c.cool });
    let acc = 0; seq.forEach(p => { p.s = acc; acc += p.d * 1000; p.e = acc; });
    this.seq = seq; this.totalMs = acc; this.reset();
    T(this.k.info, `總長 ${up(acc)}，共 ${c.rounds} 回合`);
  },
  reset() { this.clock.reset(); this.done = false; this.lastIdx = -1; this.lastSec = null; this.render(); },
  idxAt(ms) { return this.seq.findIndex(p => ms < p.e); },
  running() { return this.clock.on; },
  toggle() { this.act('toggle'); },
  act(a, b) {
    if (a === 'toggle') { if (this.done) this.reset(); this.clock.toggle(); }
    else if (a === 'reset') this.reset();
    else if (a === 'skip') { const i = this.idxAt(this.clock.ms); if (i >= 0) this.clock.set(this.seq[i].e); this.logic(); }
    else if (a === 'pre') { const [prep, work, rest, rounds, cool] = b.dataset.v.split(',').map(Number); Object.assign(this.cfg, { prep, work, rest, rounds, cool }); this.apply(); }
    this.render();
  },
  logic() {
    if (this.done || this.clock.ms === 0) return;
    const ms = this.clock.ms, i = this.idxAt(ms);
    if (i === -1) { this.clock.pause(); this.clock.set(this.totalMs); this.done = true; alarm('間歇訓練完成！辛苦了', { bell: 3 }); this.render(); return; }
    if (i !== this.lastIdx) {
      const t = this.seq[i].t;
      if (t === 'work') Sound.beep(2, 1046, 0.12); else if (t === 'rest') Sound.beep(1, 523, 0.35); else Sound.beep(1, 784, 0.2);
      if (t === 'work' || t === 'rest') vib(150);
      this.lastIdx = i; this.lastSec = null;
    }
    if (!this.clock.on) return;
    const sec = Math.ceil((this.seq[i].e - ms) / 1000);
    if (sec <= 3 && sec >= 1 && sec !== this.lastSec) { this.lastSec = sec; Sound.beep(1, 660, 0.08); }
  },
  title() { if (this.done || this.clock.ms === 0) return null; const i = this.idxAt(this.clock.ms); return i < 0 ? null : down(this.seq[i].e - this.clock.ms); },
  render() {
    const k = this.k, ms = this.clock.ms, names = { prep: '準備', work: '運動！', rest: '休息', cool: '緩和' };
    k.fs.disabled = ms > 0 && !this.done;
    T(k.toggle, this.done ? '再來一次' : this.clock.on ? '暫停' : ms > 0 ? '繼續' : '開始');
    if (this.done) { k.hero.dataset.phase = 'done'; T(k.phase, '完成 🎉'); T(k.big, up(this.totalMs)); T(k.sub, `${this.cfg.rounds} 回合全部完成`); T(k.next, ''); k.bar.style.width = '100%'; return; }
    const i = Math.max(0, this.idxAt(ms)), p = this.seq[i]; if (!p) return;
    k.hero.dataset.phase = p.t; T(k.phase, names[p.t] + (ms > 0 && !this.clock.on ? '（暫停）' : ''));
    T(k.big, down(p.e - ms)); k.bar.style.width = ((ms - p.s) / (p.d * 1000) * 100) + '%';
    T(k.sub, (p.r ? `第 ${p.r} / ${this.cfg.rounds} 回合　·　` : '') + `總剩餘 ${down(this.totalMs - ms)}`);
    const nx = this.seq[i + 1]; T(k.next, nx ? `接下來：${names[nx.t].replace('！', '')} ${nx.d} 秒` : '最後一段');
  }
};

    </div>
    <label class="check"><input type="checkbox" data-c="rep"> 超時後每 30 秒再提醒（三聲鈴）</label>
    <p class="hint">時間快到：一聲鈴；時間到：兩聲鈴（比照一般發表會習慣）。</p>
  </div>`,
  init(el) {
    this.el = el; this.k = {}; $$('[data-k]', el).forEach(n => this.k[n.dataset.k] = n);
    this.cfg = Object.assign({ min: 5, warn: 1, rep: false, mode: 'up' }, store.get('speechCfg', {}));
    this.clock = new Clock(); this.f = {};
    $$('[data-c]', el).forEach(inp => {
      if (inp.type === 'checkbox') inp.checked = this.cfg[inp.dataset.c]; else inp.value = this.cfg[inp.dataset.c];
      inp.addEventListener('change', () => { const c = inp.dataset.c; this.cfg[c] = inp.type === 'checkbox' ? inp.checked : Math.max(c === 'min' ? 0.5 : 0, num(inp.value, this.cfg[c])); this.saveCfg(); });
    });
    el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) this.act(b.dataset.act, b); });
  },
  saveCfg() { store.set('speechCfg', this.cfg); $$('[data-c]', this.el).forEach(inp => { if (inp.type !== 'checkbox') inp.value = this.cfg[inp.dataset.c]; }); this.render(); },
  running() { return this.clock.on; },
  toggle() { this.act('toggle'); },
  act(a, b) {
    if (a === 'toggle') this.clock.toggle();
    else if (a === 'reset') { this.clock.reset(); this.f = {}; }
    else if (a === 'mode') { this.cfg.mode = this.cfg.mode === 'up' ? 'down' : 'up'; }
    else if (a === 'pre') { this.cfg.min = +b.dataset.v; this.clock.reset(); this.f = {}; }
    this.saveCfg();
  },
  logic() {
    if (!this.clock.on) return;
    const ms = this.clock.ms, Tm = this.cfg.min * 60000, W = Tm - this.cfg.warn * 60000, f = this.f;
    if (this.cfg.warn > 0 && ms >= W && ms < Tm && !f.w) { f.w = true; Sound.bell(1); toast(`剩 ${fmtMin(this.cfg.warn)} 分鐘`); }
    if (ms >= Tm && !f.e) { f.e = true; f.w = true; Sound.bell(2); toast('時間到！', 3500); flash(); }
    if (this.cfg.rep && ms >= Tm + 30000) { const n = Math.floor((ms - Tm) / 30000); if (n !== f.k) { f.k = n; Sound.bell(3); } }
  },
  title() { return this.clock.ms > 0 ? up(this.clock.ms) : null; },
  render() {
    const k = this.k, ms = this.clock.ms, Tm = this.cfg.min * 60000, W = Tm - this.cfg.warn * 60000;
    const light = ms === 0 && !this.clock.on ? 'idle' : ms >= Tm ? 'red' : this.cfg.warn > 0 && ms >= W ? 'yellow' : 'green';
    k.hero.dataset.light = light;
    T(k.phase, { idle: '準備', green: '發表中', yellow: '時間快到了', red: '時間到' }[light] + (ms > 0 && !this.clock.on ? '（暫停）' : ''));
    T(k.big, this.cfg.mode === 'up' ? up(ms) : down(Tm - ms));
    T(k.sub, `時限 ${fmtMin(this.cfg.min)} 分鐘` + (this.cfg.warn > 0 ? `　·　剩 ${fmtMin(this.cfg.warn)} 分鐘黃燈` : '') + (ms > Tm ? `　·　已超時 ${up(ms - Tm)}` : ''));
    k.lg.classList.toggle('on', light === 'green'); k.ly.classList.toggle('on', light === 'yellow'); k.lr.classList.toggle('on', light === 'red');
    T(k.toggle, this.clock.on ? '暫停' : ms > 0 ? '繼續' : '開始'); T(k.mode, this.cfg.mode === 'up' ? '改顯示剩餘' : '改顯示已用');
    $$('[data-act="pre"]', this.el).forEach(c => c.classList.toggle('on', +c.dataset.v === this.cfg.min));
  }
};

/* ================= 首頁、路由與主迴圈 ================= */
const MODULES = [gym, hiit, pomo, teach, cd, speech, exam, sw];
const CATS = ['運動健身', '專注學習', '教學課堂', '通用工具'];
let current = 'home';

function buildHome() {
  const home = $('#v-home');
  home.innerHTML = `<div class="intro"><h2>計時器工具箱</h2><p>選一個計時器開始。各計時器可同時在背景運作，卡片右上角會顯示正在進行的時間。</p></div>` +
    CATS.map(c => { const ms = MODULES.filter(m => m.cat === c); return ms.length ? `<div class="cat">${c}</div><div class="grid">${ms.map(m =>
      `<a class="tcard" href="#${m.id}"><span class="ic">${m.icon}</span><div><h3>${m.name}</h3><p>${m.desc}</p></div><span class="live mono" data-live="${m.id}"></span></a>`).join('')}</div>` : ''; }).join('') +
    `<div class="foot">💡 網址後面加上 ${MODULES.map(m => `<code>#${m.id}</code>`).join(' ')} 可直接開啟指定計時器，嵌入 Google 協作平台時可為每個頁面放不同計時器。<br>
     ⌨️ 快捷鍵：空白鍵 開始／暫停、F 全螢幕。設定與紀錄只存在這台裝置的瀏覽器中。</div>`;
}
function setup() {
  buildHome();
  const app = $('#app');
  MODULES.forEach(m => { const sec = document.createElement('section'); sec.className = 'view'; sec.id = 'v-' + m.id; sec.hidden = true; sec.innerHTML = m.html; app.appendChild(sec); m.init(sec); });
  window.addEventListener('hashchange', route); route();
  // 頂端按鈕
  const sb = $('#soundBtn'), paintSound = () => { sb.textContent = Sound.on ? '🔔' : '🔕'; sb.title = Sound.on ? '音效：開' : '音效：關'; };
  paintSound(); sb.onclick = () => { Sound.on = !Sound.on; store.set('sound', Sound.on); paintSound(); if (Sound.on) Sound.beep(1); toast(Sound.on ? '音效已開啟' : '音效已關閉'); };
  const themes = ['auto', 'light', 'dark'], applyTheme = t => { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; };
  let theme = store.get('theme', 'auto'); applyTheme(theme);
  $('#themeBtn').onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; applyTheme(theme); store.set('theme', theme); toast({ auto: '外觀：跟隨系統', light: '外觀：淺色', dark: '外觀：深色' }[theme]); };
  $('#fsBtn').onclick = toggleFs;
  document.addEventListener('fullscreenchange', () => document.documentElement.classList.toggle('fs', !!document.fullscreenElement));
  document.addEventListener('webkitfullscreenchange', () => document.documentElement.classList.toggle('fs', !!document.webkitFullscreenElement));
  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  if (inFrame) $('#newTabBtn').hidden = false;
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,select,[contenteditable]') || e.ctrlKey || e.metaKey || e.altKey || $('.modal')) return;
    const m = MODULES.find(x => x.id === current); if (!m) return;
    if (e.code === 'Space') { e.preventDefault(); m.toggle && m.toggle(); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();
    else if (m.key && m.key(e)) e.preventDefault();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Wake.lock = null; });
  const frame = () => { loop(); requestAnimationFrame(frame); };
  requestAnimationFrame(frame); setInterval(loop, 500); // 分頁在背景時 rAF 會停，用 interval 保證提醒照常觸發
}
function toggleFs() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) { toast('此瀏覽器不支援全螢幕'); return; }
  try { const p = req.call(el); if (p && p.catch) p.catch(() => toast('嵌入頁面無法全螢幕，請按 ↗ 在新分頁開啟')); } catch (e) { toast('嵌入頁面無法全螢幕，請按 ↗ 在新分頁開啟'); }
}
function route() {
  const id = location.hash.slice(1), m = MODULES.find(x => x.id === id);
  current = m ? m.id : 'home';
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + current);
  $('#backBtn').hidden = current === 'home';
  $('#pageTitle').textContent = m ? `${m.icon} ${m.name}` : '計時器工具箱';
  $('#newTabBtn').href = location.href;
  if (m) m.render();
  window.scrollTo(0, 0);
}
let lastTitle = '';
function loop() {
  for (const m of MODULES) { try { m.logic(); } catch (e) { console.error(m.id, e); } }
  const m = MODULES.find(x => x.id === current);
  if (m) { try { m.render(); } catch (e) { console.error(m.id, e); } }
  else MODULES.forEach(x => { const el = $(`[data-live="${x.id}"]`); if (el) T(el, x.running() ? (x.title() || '進行中') : ''); });
  const t = m && m.title() ? `${m.title()} · ${m.name}` : (m ? m.name + ' · 計時器工具箱' : '計時器工具箱');
  if (t !== lastTitle) { document.title = t; lastTitle = t; }
  Wake.want(MODULES.some(x => x.running()));
}
setup();
</script>
