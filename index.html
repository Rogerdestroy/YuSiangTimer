<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<title>YSTimer 計時器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%231f7a5c'/%3E%3Crect x='26' y='4' width='12' height='8' rx='2' fill='%231f7a5c'/%3E%3Cpath d='M32 36V20' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f2;--surface:#fff;--surface2:#eef0ec;--text:#1c2320;--muted:#65706a;--line:#dce0da;
  --accent:#1f7a5c;--accent-ink:#fff;--work:#d4531c;--rest:#2b8a52;--warn:#c98a00;--danger:#c62f38;--info:#2f6fb5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111513;--surface:#1a1f1c;--surface2:#232a26;--text:#e7ebe8;--muted:#9aa49e;--line:#2d3531;
  --accent:#3db387;--accent-ink:#06140e;--work:#ff7b45;--rest:#4cc47c;--warn:#f0b72f;--danger:#ff5f68;--info:#62a1e6;--shadow:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);min-height:100vh;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0 6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{text-decoration:none;font-weight:700;padding:8px 10px;border-radius:10px;color:var(--accent);white-space:nowrap}
.back:hover{background:var(--surface2)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-decoration:none;font-size:18px;flex:none;color:var(--text)}
.iconbtn:hover{background:var(--surface2)}
main{max-width:900px;margin:0 auto;padding:16px 16px 56px}

/* 首頁 */
.intro h2{font-size:26px;margin:6px 0 2px}
.intro p{margin:0;color:var(--muted)}
.cat{margin:22px 2px 10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tcard{position:relative;display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .ic{font-size:28px;width:48px;height:48px;display:grid;place-items:center;background:var(--surface2);border-radius:12px;flex:none}
.tcard h3{margin:0;font-size:16.5px}
.tcard p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.live{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.live:empty{display:none}
.foot{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.7}
code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:14px;white-space:nowrap}
#pauseAllBtn{flex:none;white-space:nowrap}

/* 共用 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hero{--c:var(--accent);text-align:center;padding:22px 14px 18px;position:relative;overflow:hidden}
.hero .phase{font-weight:700;color:var(--c);font-size:18px;min-height:1.5em}
.hero .stepname{font-size:clamp(28px,6.5vw,48px);font-weight:800;line-height:1.2;margin:2px 0;color:var(--c);word-break:break-word}
.big{font-size:clamp(68px,18vw,160px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:4px 0}
.hero .sub{color:var(--muted);font-size:15px;min-height:1.5em}
.hero.over .big{color:var(--danger)}
.hero[data-phase="work"]{--c:var(--work)}
.hero[data-phase="rest"]{--c:var(--rest)}
.hero[data-phase="prep"]{--c:var(--info)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px auto 4px;max-width:560px}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--accent));border-radius:inherit;transition:width .3s linear}
.hero.over .bar i{background:var(--danger)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:10px 18px;border-radius:12px;cursor:pointer;min-height:48px;min-width:96px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.xl{font-size:20px;padding:14px 28px;min-width:min(100%,240px);min-height:58px}
.btn.sm{min-height:36px;min-width:0;padding:5px 12px;font-size:14px;font-weight:600}
.btn.danger{color:var(--danger)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips.center{justify-content:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 16px;cursor:pointer;font-size:15px;font-weight:600;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lbl{font-size:14px;color:var(--muted);font-weight:600;text-align:center;margin:0 0 8px}
input{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:40px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=number]{width:66px;text-align:center;padding:7px 4px}
input[type=time]{width:auto}
.mmss{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:14px;white-space:nowrap}
.custom{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0;text-align:center}
table.log{width:100%;border-collapse:collapse;font-size:15px}
table.log th,table.log td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.log th{font-size:13px;color:var(--muted);font-weight:600}
table.log .num{text-align:right;font-variant-numeric:tabular-nums}
.d-over{color:var(--danger);font-weight:700}.d-under{color:var(--info);font-weight:700}
.sdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* 圓環 */
.ringwrap{position:relative;width:min(76vw,320px);aspect-ratio:1;margin:4px auto}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--surface2)}
.ring .fg{stroke:var(--c);stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset .3s linear}
.hero.over .ring .fg{stroke:var(--danger)}
.ringwrap .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .big{font-size:clamp(52px,15vw,84px)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.dots i.on{background:var(--work);border-color:var(--work)}

/* 重訓 */
.restgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.restbtn{border:2px solid var(--rest);background:var(--surface);color:var(--rest);border-radius:16px;padding:14px 4px;font-size:clamp(26px,7vw,38px);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.restbtn small{font-size:15px;margin-left:2px;font-weight:700}
.restbtn:hover{background:var(--rest);color:#fff}
.restbtn.last{background:color-mix(in srgb,var(--rest) 14%,var(--surface))}

/* 試教 */
.steps{display:flex;flex-direction:column;gap:8px}
.step-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.step-row.zero{opacity:.5}
.step-row .sw{width:10px;height:30px;border-radius:4px}
.step-row .nm{background:var(--surface)}
.step-row input[type=number]{width:54px;background:var(--surface)}
.ib{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted)}
.ib:hover:not(:disabled){background:var(--line);color:var(--text)}
.ib:disabled{opacity:.25;cursor:default}
@media (max-width:520px){
  .step-row{grid-template-columns:10px minmax(0,1fr) auto;grid-template-areas:"s n n" "s m o"}
  .step-row .sw{grid-area:s;height:100%}.step-row .nm{grid-area:n}.step-row .mmss{grid-area:m}.step-row .ops{grid-area:o}
}
.alloc-bar,.timeline{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--surface2);position:relative;margin-top:12px}
.alloc-bar>div,.timeline>div{min-width:2px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;border-right:2px solid var(--surface);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.alloc-bar>.gap{background:repeating-linear-gradient(45deg,var(--surface2) 0 6px,var(--line) 6px 12px);color:var(--muted);text-shadow:none}
.alloc-text{font-size:14px;margin-top:6px;font-weight:700}
.alloc-text.ok{color:var(--rest)}.alloc-text.under{color:var(--warn)}.alloc-text.over{color:var(--danger)}
.timeline{height:36px;margin:0 0 14px}
.timeline>div{opacity:.35}.timeline>div.done{opacity:.65}.timeline>div.cur{opacity:1}
.teach-run .hero{border-top:6px solid var(--c)}

/* 棋鐘 */
.chess{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cside{border:2px solid var(--line);background:var(--surface);border-radius:20px;min-height:min(46vh,340px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .15s}
.cside .t{font-size:clamp(48px,11vw,110px);font-weight:700;letter-spacing:-.02em}
.cside .n{font-weight:700;color:var(--muted)}
.cside.act{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cside.act .n{color:inherit;opacity:.85}
.cside.out{background:var(--danger);color:#fff;border-color:transparent}
@media (max-width:640px){.chess{grid-template-columns:1fr}.cside{min-height:30vh}.cside.top{transform:rotate(180deg)}}

/* 呼吸 */
.breath{width:min(72vw,300px);aspect-ratio:1;margin:10px auto;display:grid;place-items:center;position:relative}
.breath .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--info) 55%,#fff),var(--info));transform:scale(.55);transition:transform .25s linear;opacity:.85}
.breath .txt{position:relative;color:#fff;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.breath .txt b{display:block;font-size:30px}
.breath .txt span{font-size:44px;font-weight:700}

/* 廚房 */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:center}
.kcard .nm{font-weight:700}
.kcard .t{font-size:44px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.kcard .acts{display:flex;gap:6px;justify-content:center}
.kcard.done{border-color:var(--danger);animation:pulse 1s infinite}
.kcard.done .t{color:var(--danger)}
@keyframes pulse{50%{background:color-mix(in srgb,var(--danger) 14%,var(--surface))}}

/* 考試 */
.exam-hero{text-align:center;padding:24px 14px}
.exam-date{color:var(--muted);font-weight:600;font-size:clamp(16px,2.5vw,22px)}
.exam-clock{font-size:clamp(72px,19vw,200px);font-weight:700;line-height:1;margin:6px 0 10px}
.exam-subject{font-size:clamp(26px,5vw,46px);font-weight:800;margin:0}
.exam-range{color:var(--muted);font-size:clamp(17px,2.6vw,24px);font-weight:600}
.exam-status{display:inline-flex;flex-direction:column;align-items:center;margin-top:14px;padding:10px 26px;border-radius:16px;background:var(--surface2);min-width:min(100%,300px)}
.exam-status .l{font-weight:700;color:var(--muted)}
.exam-status .v{font-size:clamp(40px,9vw,80px);font-weight:700;line-height:1.1}
.exam-status.warn .v{color:var(--warn)}.exam-status.bad .v{color:var(--danger)}
.erow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:12px;color:var(--muted);font-size:14px;font-weight:600}
.erow input:not([type]){max-width:320px}

/* 發表 */
.speech-hero{transition:background .4s,color .4s}
.speech-hero[data-light="green"]{background:#2b8a52;color:#fff;border-color:transparent}
.speech-hero[data-light="yellow"]{background:#e2a600;color:#1a1400;border-color:transparent}
.speech-hero[data-light="red"]{background:#c62f38;color:#fff;border-color:transparent}
.speech-hero[data-light] .phase,.speech-hero[data-light] .sub{color:inherit}
.speech-hero[data-light="idle"] .phase{color:var(--muted)}
.laps{max-width:420px;margin:0 auto}

/* 遊戲 */
.pad{user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;min-height:min(50vh,400px);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:2px solid var(--line);margin-bottom:12px;text-align:center;padding:16px;box-shadow:var(--shadow)}
.pad b{font-size:clamp(34px,9vw,64px);font-weight:800;line-height:1.2}
.pad span{font-size:17px;opacity:.85}
.pad.red{background:#c62f38;color:#fff;border-color:transparent}
.pad.green{background:#2b8a52;color:#fff;border-color:transparent}
.pad.blue{background:var(--info);color:#fff;border-color:transparent}
.pad.warn{background:#e2a600;color:#1a1400;border-color:transparent}
.pad.run{background:var(--work);color:#fff;border-color:transparent}
.pad.run.hit b{animation:hit .12s}
@keyframes hit{50%{transform:scale(1.12)}}
.pad.beat{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pad.hitc{border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}
.meter{position:relative;width:min(80%,360px);height:10px;background:var(--surface2);border-radius:99px;margin-top:16px}
.meter i{position:absolute;left:50%;top:-7px;bottom:-7px;width:3px;margin-left:-1px;background:var(--rest);border-radius:2px}
.meter em{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--work);transform:translate(-50%,-50%);transition:left .12s}
.pad .ml{font-weight:700;font-size:18px;min-height:1.4em}
.cust{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.cust input{width:72px}
.tapzone{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sgrid{display:grid;gap:8px;max-width:460px;margin:0 auto 14px}
.sgrid:empty{display:none}
.scell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:clamp(18px,5.5vw,32px);font-weight:800;cursor:pointer;touch-action:manipulation;user-select:none;color:var(--text);padding:0}
.scell.done{opacity:.2}
.scell.bad{animation:bad .35s}
@keyframes bad{0%,60%{background:var(--danger);color:#fff}}
.bomb-hero{--heat:0;transition:background .3s}
.bomb-hero.live{background:color-mix(in srgb,#c62f38 calc(var(--heat)*100%),var(--surface));animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(198,47,56,.18),0 0 40px rgba(198,47,56,.35)}}
.bomb{--sc:1;font-size:clamp(100px,28vw,180px);line-height:1.15;display:inline-block;transform:scale(var(--sc))}
.bomb.tick{animation:tick .18s}
@keyframes tick{30%{transform:scale(calc(var(--sc)*1.1)) rotate(-7deg)}70%{transform:scale(calc(var(--sc)*1.05)) rotate(6deg)}}
.fuse{position:relative;height:12px;max-width:460px;margin:6px auto 10px;background:var(--surface2);border-radius:99px}
.fuse i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:repeating-linear-gradient(45deg,#8a5a2b 0 8px,#b07a3a 8px 16px);transition:width .3s linear}
.fuse b{position:absolute;top:50%;font-size:28px;transform:translate(-50%,-55%);animation:spark .15s infinite alternate;transition:left .3s linear}
@keyframes spark{to{transform:translate(-50%,-55%) scale(1.35) rotate(25deg)}}
.cd{font-size:clamp(22px,5vw,32px);font-weight:800}
.bomb-hero.live .phase{color:#c62f38;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.hero.boom{background:#c62f38;border-color:transparent;color:#fff}
.hero.boom .phase,.hero.boom .sub{color:#fff}
#app.shake{animation:shake .6s}
@keyframes shake{10%,50%,90%{transform:translate(-8px,4px)}30%,70%{transform:translate(8px,-4px)}}
.particle{position:fixed;z-index:58;pointer-events:none;transform:translate(0,0);transition:transform 1.1s cubic-bezier(.2,.7,.3,1),opacity 1.1s ease-in;margin:-20px 0 0 -20px}

/* 其他 */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.flash::after{content:"";position:fixed;inset:0;background:var(--accent);pointer-events:none;z-index:55;animation:fl 1.2s ease-out}
@keyframes fl{0%{opacity:.45}25%{opacity:0}45%{opacity:.35}100%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;padding:20px;width:min(400px,100%)}
.modal p{margin:0 0 14px;white-space:pre-line}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
:root.fs .cfg{display:none!important}
:root.fs main{max-width:none}
:root.fs .big{font-size:clamp(90px,22vw,320px)}
:root.fs .exam-clock{font-size:clamp(100px,24vw,340px)}
:root.fs .hero .stepname{font-size:clamp(34px,7vw,90px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" id="backBtn" href="#">‹ 全部</a>
  <h1 id="pageTitle">YSTimer 計時器</h1>
  <button class="btn sm" id="pauseAllBtn" title="暫停所有計時器" hidden>⏸ 全部暫停</button>
  <button class="iconbtn" id="soundBtn" title="音效開關">🔔</button>
  <a class="iconbtn" id="setBtn" href="#settings" title="設定">⚙️</a>
  <a class="iconbtn" id="siteBtn" href="https://tool.yu-siang.com/" target="_top" title="回到 YuSiangTOOL 主頁">🏠</a>
  <button class="iconbtn" id="fsBtn" title="全螢幕（F）">⛶</button>
  <a class="iconbtn" id="newTabBtn" target="_blank" rel="noopener" title="在新分頁開啟" hidden>↗</a>
</header>
<main id="app"><section id="v-home" class="view"></section><section id="v-settings" class="view" hidden></section></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ========== 共用工具 ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('ystimer2:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ystimer2:' + k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');

  init(el) { this.el = el; this.k = keys(el); this.cfg = Object.assign({ pat: 0, len: 3 }, store.get('breath', {})); this.clock = new Clock(); this.lastPh = -1; onAct(el, (a, b) => this.act(a, b)); },
  running() { return this.clock.on; },
  toggle() { this.act('toggle'); },
  act(a, b) {
    if (a === 'toggle') { if (this.clock.on) { this.clock.reset(); } else { this.clock.reset(); this.lastPh = -1; this.clock.play(); } }
    else { this.cfg[a] = +b.dataset.v; store.set('breath', this.cfg); this.clock.reset(); }
    this.render();
  },
  pos() {
    const seq = BREATH[this.cfg.pat].seq, cyc = seq.reduce((a, s) => a + s[1], 0) * 1000; let t = this.clock.ms % cyc;
    for (let i = 0; i < seq.length; i++) { const d = seq[i][1] * 1000; if (t < d) return { i, seq, p: t / d, rem: d - t }; t -= d; }
    return { i: 0, seq, p: 0, rem: seq[0][1] * 1000 };
  },
  logic() {
    if (!this.clock.on) return;

    const { i, seq } = this.pos(), key = i + '-' +Math.floor(this.clock.ms / (seq.reduce((a, s) => a + s[1], 0) * 1000));

  title() { return this.clock.on ? this.pos().seq[this.pos().i][0] : null; },
  render() {
    const k = this.k;
    $$('[data-act="pat"]', this.el).forEach(c => c.classList.toggle('on', +c.dataset.v === this.cfg.pat));
    $$('[data-act="len"]', this.el).forEach(c => c.classList.toggle('on', +c.dataset.v === this.cfg.len));
    T(k.tg, this.clock.on ? '停止' : '開始');
    if (!this.clock.on) { T(k.ph, '準備'); T(k.sec, ''); k.orb.style.transform = 'scale(.55)'; T(k.sub, `${BREATH[this.cfg.pat].n}・${this.cfg.len} 分鐘`); return; }
    const { i, seq, p, rem } = this.pos(), name = seq[i][0];
    let sc = .55;
    if (name === '吸氣') sc = .55 + .45 * p; else if (name === '吐氣') sc = 1 - .45 * p; else sc = (i > 0 && seq[i - 1][0] === '吸氣') ? 1 : .55;
    k.orb.style.transform = `scale(${sc})`; T(k.ph, name); T(k.sec, String(Math.ceil(rem / 1000)));
    T(k.sub, `剩 ${down(this.cfg.len * 60000 - this.clock.ms)}`);
  }
};

/* ========== 5. 試教計時器 ========== */
const COLORS = ['#e07a3f', '#d39e12', '#4fa262', '#2c8f8a', '#3b7bd0', '#8a63c9', '#c9578a', '#7d8a92', '#b5651d', '#5d8f2f'];
const TEACH_DEFAULT = () => ({ total: 900, steps: [['進場與問好', 30], ['引起動機', 30], ['連結先備經驗', 60], ['主要內容', 360], ['實作', 360], ['統整', 30], ['回家作業', 30], ['其他', 0]].map(([name, sec], c) => ({ name, sec, c })) });
const teach = {

    <div class="card hero" data-k="hero">

    <div class="timeline" data-k="timeline"></div>
    <div class="row"><button class="btn" data-act="pause" data-k="pause">暫停</button><button class="btn primary xl" data-act="next" data-k="nextbtn">下一步 ▶</button></div>

    <div class="card"><table class="log"><thead><tr><th>步驟</th><th class="num">預計</th><th class="num">實際</th><th class="num">差異</th></tr></thead><tbody data-k="rtable"></tbody></table></div>

  init(el) {

    onAct(el, (a, b) => this.act(a, b));
    $$('[data-tt]', el).forEach(i => i.addEventListener('input', () => { this.cfg.total = readMMSS(el, 'tt'); this.save(); this.renderAlloc(); }));
    $$('[data-tt]', el).forEach(i => i.addEventListener('change', () => fillMMSS(el, 'tt', this.cfg.total)));
    this.k.steps.addEventListener('input', e => {
      const row = e.target.closest('.step-row'); if (!row) return; const st = this.cfg.steps[+row.dataset.i];

  async act(a, b) {

        on.forEach(s => s.sec = Math.round(s.sec * c.total / sum / 5) * 5);
        const diff = c.total - on.reduce((x, s) => x + s.sec, 0), big = on.reduce((m, s) => s.sec > m.sec ? s : m, on[0]); big.sec = Math.max(0, big.sec + diff); break;

    this.run = { steps, idx: 0, actual: steps.map(() => 0), warned: [], ended: [], plan: sum };

  go(i) { const r = this.run; r.actual[r.idx] = this.clock.ms; r.idx = i; this.clock.set(r.actual[i]); this.buildTimeline(); this.renderRun(); Sound.beep(1, 880, 0.12); },

  },
  title() { if (this.view !== 'run') return null; const st = this.run.steps[this.run.idx]; return `${down(st.dur - this.clock.ms)} ${st.name}`; },
  render() { if (this.view === 'run') this.renderRun(); },
  renderSetup() {
    const c = this.cfg; fillMMSS(this.el, 'tt', c.total);
    this.k.steps.innerHTML = c.steps.map((s, i) => `<div class="step-row${s.sec ? '' : ' zero'}" data-i="${i}">

      <span class="ops"><button class="ib" data-act="up" ${i ? '' : 'disabled'} aria-label="上移">↑</button><button class="ib" data-act="del" ${c.steps.length > 1 ? '' : 'disabled'} aria-label="刪除">✕</button></span></div>`).join('');
    this.renderAlloc();
  },
  renderAlloc() {
    const c = this.cfg, on = c.steps.filter(s => s.sec > 0), sum = on.reduce((a, s) => a + s.sec, 0), diff = c.total - sum, scale = Math.max(sum, c.total) || 1;
    this.k.allocbar.innerHTML = on.map(s => `<div style="flex:${s.sec / scale};background:${COLORS[s.c % COLORS.length]}" title="${esc(s.name)}">${esc(s.name)}</div>`).join('') + (diff > 0 ? `<div class="gap" style="flex:${diff / scale}">未分配</div>` : '');

  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  $('#newTabBtn').hidden = !inFrame;
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey || $('.modal')) return;
    const m = MODULES.find(x => x.id === current); if (!m) return;
    if (m.key && m.key(e)) { e.preventDefault(); return; }
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && m.toggle) m.toggle(); }
    else if (e.key === 'f' || e.key === 'F') toggleFs();

  const frame = () => { loop(); requestAnimationFrame(frame); }; requestAnimationFrame(frame); setInterval(loop, 500);
}
function paintSound() { $('#soundBtn').textContent = Sound.on ? '🔔' : '🔕'; const c = $('#setSound'); if (c) c.checked = Sound.on; }
function setSound(on) { Sound.on = on; store.set('sound', on); paintSound(); toast(on ? '音效開啟' : '音效關閉'); if (on) Sound.beep(1); }
const activeTimers = () => MODULES.filter(m => m.id !== 'exam' && m.running());
function pauseAll() {
  const list = activeTimers();
  list.forEach(m => { if (m.pauseAll) m.pauseAll(); else if (m.clock) m.clock.pause(); });
  toast(list.length ? `已暫停：${list.map(m => m.name).join('、')}` : '目前沒有計時器在跑');
}
function buildSettings() {
  const base = location.href.split('#')[0];
  $('#v-settings').innerHTML = `
  <div class="card"><div class="card-head"><h3>全部暫停</h3><button class="btn primary" id="setPause">⏸ 全部暫停</button></div>
    <p class="hint" style="text-align:left;margin:0">一次暫停所有正在跑的計時器（考試時鐘依實際時間，不受影響）。有計時器在跑時，上方也會出現這顆按鈕。</p></div>
  <div class="card"><div class="card-head" style="margin:0"><h3>音效</h3><label class="mmss" style="font-size:15px;color:var(--text);cursor:pointer"><input type="checkbox" id="setSound" style="width:22px;height:22px;min-height:0;accent-color:var(--accent)"> 時間到響鈴／嗶聲</label></div></div>
  <div class="card"><h3 style="margin-bottom:6px">直接開啟指定計時器</h3>
    <p class="hint" style="text-align:left;margin:0 0 8px">網址後面加上代碼，就會直接打開那個計時器，適合在協作平台為每個計時器各放一個按鈕。</p>
    <table class="log">${MODULES.map(m => `<tr><td>${m.icon} ${m.name}</td><td><code>#${m.id}</code></td><td class="num"><button class="btn sm" data-copy="${esc(base + '#' + m.id)}">複製網址</button></td></tr>`).join('')}</table></div>
  <div class="card"><div class="card-head" style="margin:0"><h3>回到主頁</h3><a class="btn sm" href="${SITE}" target="_top" style="text-decoration:none;display:inline-flex;align-items:center">🏠 YuSiangTOOL</a></div></div>
  <div class="card"><h3 style="margin-bottom:6px">快捷鍵</h3>
    <table class="log"><tr><td><code>空白鍵</code></td><td>開始／暫停（重訓：開始／休息／下一組）</td></tr><tr><td><code>F</code></td><td>全螢幕（投影時好用）</td></tr><tr><td><code>← →</code></td><td>試教計時器切換步驟</td></tr></table></div>
  <div class="card"><div class="card-head" style="margin:0"><h3>資料</h3><button class="btn sm danger" id="setClear">清除所有設定與紀錄</button></div>
    <p class="hint" style="text-align:left;margin:6px 0 0">所有設定只存在這台裝置的瀏覽器，不會上傳。</p></div>`;
  $('#setPause').onclick = pauseAll;
  $('#setSound').onchange = e => setSound(e.target.checked);
  $('#setClear').onclick = async () => {
    if (!await ask('清除所有計時器的設定與紀錄？', '清除')) return;
    try { Object.keys(localStorage).filter(k => k.startsWith('ystimer2:')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    location.hash = ''; location.reload();
  };
  $('#v-settings').addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (!b) return; const t = b.dataset.copy;
    (navigator.clipboard && window.isSecureContext ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('已複製網址'), () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('已複製網址'); } catch (x) { toast(t); } ta.remove(); }); });
}
function toggleFs() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement) return d.exitFullscreen();
  const req = el.requestFullscreen || el.webkitRequestFullscreen; const fail = () => toast('嵌入頁面無法全螢幕，請按 ↗ 在新分頁開啟');
  if (!req) return fail(); try { const p = req.call(el); if (p && p.catch) p.catch(fail); } catch (e) { fail(); }
}
function route() {
  const id = location.hash.slice(1), m = MODULES.find(x => x.id === id); current = m ? m.id : id === 'settings' ? 'settings' : 'home';
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + current);
  const bb = $('#backBtn');
  if (current === 'home') { bb.href = SITE; bb.target = '_top'; bb.textContent = '‹ YuSiangTOOL'; bb.title = '回到 YuSiangTOOL 主頁'; }
  else { bb.href = '#'; bb.removeAttribute('target'); bb.textContent = '‹ 全部'; bb.title = '回到計時器列表'; } $('#setBtn').hidden = current === 'settings';
  $('#pageTitle').textContent = m ? `${m.icon} ${m.name}` : current === 'settings' ? '⚙️ 設定' : '';
  paintSound(); $('#newTabBtn').href = location.href;
  if (m) m.render(); window.scrollTo(0, 0);
}
let lastTitle = '';
function loop() {
  for (const m of MODULES) { try { m.logic(); } catch (e) { console.error(m.id, e); } }
  const m = MODULES.find(x => x.id === current);
  if (m) { try { m.render(); } catch (e) { console.error(m.id, e); } }
  else if (current === 'home') MODULES.forEach(x => T($(`[data-live="${x.id}"]`), x.running() && x.id !== 'exam' ? (x.title() || '進行中') : ''));
  const pb = $('#pauseAllBtn'), any = activeTimers().length > 0; if (pb.hidden === any) pb.hidden = !any;
  const t = m && m.title() ? `${m.title()} · ${m.name}` : (m ? m.name : 'YSTimer 計時器');
  if (t !== lastTitle) document.title = lastTitle = t;
  Wake.want(MODULES.some(x => x.running()));
}
setup();
</script>
